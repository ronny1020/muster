[package]
name = "muster"
version = "0.1.1"
description = "Tabbed desktop runner for AI agent CLIs"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "muster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
parking_lot = "0.12"
tauri-plugin-notification = "2"
base64 = "0.23.1"
ureq = "3.2.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.189"
