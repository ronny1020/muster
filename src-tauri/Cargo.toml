[package]
name = "muster"
version = "0.3.0"
description = "Tabbed desktop runner for AI agent CLIs"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"

[lib]
name = "muster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
parking_lot = "0.12"
tauri-plugin-notification = "2"
base64 = "0.23.1"
ureq = "3.2.1"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# Pinned exactly: it is the only dependency that injects script into
# this app's own webview, so a floating minor is a channel for page code.
tauri-plugin-prevent-default = "=5.0.2"
# Enumerates installed font families, which neither webview can do: Chromium's
# `queryLocalFonts` needs a permission prompt and WKWebView lacks it entirely.
# `source-fontconfig-dlopen` loads libfontconfig at runtime rather than linking
# it, so the Linux build needs no package the webview toolkit does not already
# bring.
font-kit = { version = "0.14", features = ["source-fontconfig-dlopen"] }

# A debugging aid, never shipped. It opens a local socket that executes
# arbitrary JavaScript in this app's webview and simulates input, which is a
# capability no release build should carry — and the crate is unlicensed and
# `edition = "2024"`, so compiling it would also raise this crate's stated
# `rust-version` of 1.77. Optional and default-off keeps all three out of every
# build but the one that asks: `bun run dev:mcp`.
[features]
mcp = ["dep:tauri-plugin-mcp"]

[dependencies.tauri-plugin-mcp]
git = "https://github.com/P3GLEG/tauri-plugin-mcp"
rev = "c7d271a06469bdf4744bfdeadca7458a1f3d02e5"
optional = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
# `preventDefault` from a page listener does not reliably stop WebView2's own
# `F5`/`Ctrl+R`; this feature disables the browser accelerator keys natively,
# which is the entire reason the plugin is here.
tauri-plugin-prevent-default = { version = "=5.0.2", features = [
  "platform-windows",
] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
