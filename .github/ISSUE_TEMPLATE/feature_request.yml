name: Feature request
description: Suggest something Muster should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution — it often has a simpler answer.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: Which agent CLI, if it is specific to one
      placeholder: Codex
