# Pushes a published release's version and checksums into the Homebrew tap and
# the Scoop bucket, so a release is one action rather than three.
#
# Runs on every published release, and can be run by hand for a release whose
# event has already passed:
#
#   gh workflow run update-packages.yml -f version=v0.2.1
#
# It needs one secret: PACKAGES_PAT, a fine-grained token with Contents: read
# and write on ronny1020/homebrew-tap and ronny1020/scoop-bucket only. The
# automatic GITHUB_TOKEN cannot stand in — it is scoped to this repository, and
# a tap has to live in its own. Without the secret the run stops at the gate
# below, stays green, and writes the checksums and the manual steps into the
# run summary rather than failing on an error that names neither.
name: update-packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: The release tag to publish manifests for, e.g. v0.2.1
        required: true

jobs:
  publish-manifests:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Download the release assets
        run: |
          # The tag carries a leading v; the manifests do not.
          echo "PLAIN_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --pattern '*-setup.exe' \
            --dir assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the checksums
        run: |
          cd assets
          {
            echo "SHA_AARCH64=$(sha256sum ./*_aarch64.dmg | cut -d' ' -f1)"
            echo "SHA_X64_DMG=$(sha256sum ./*_x64.dmg | cut -d' ' -f1)"
            echo "SHA_X64_EXE=$(sha256sum ./*-setup.exe | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      # `actions/checkout` against another repository fails with
      # "Input required and not supplied: token" when the secret is absent,
      # which names neither the secret nor the repository and reads like a
      # broken workflow. Stopping here says what is missing and what the
      # release still needs, and leaves the run green: the release itself
      # succeeded, and only the manifests are behind.
      - name: Require the cross-repository token
        id: token
        run: |
          if [ -z "$PACKAGES_PAT" ]; then
            {
              echo "### Manifests not updated"
              echo
              echo "\`PACKAGES_PAT\` is not set, so the Homebrew cask and the"
              echo "Scoop manifest still point at the previous version and"
              echo "\`brew upgrade --cask muster\` will report nothing to do."
              echo
              echo "Create a fine-grained token with **Contents: read and write**"
              echo "on \`ronny1020/homebrew-tap\` and \`ronny1020/scoop-bucket\`"
              echo "only, add it as the \`PACKAGES_PAT\` repository secret, then:"
              echo
              echo "    gh workflow run update-packages.yml -f version=$VERSION"
              echo
              echo "Until then, docs/RELEASE.md's step 4 has the manual edits."
              echo "The checksums this run computed:"
              echo
              echo "    aarch64.dmg  $SHA_AARCH64"
              echo "    x64.dmg      $SHA_X64_DMG"
              echo "    x64-setup    $SHA_X64_EXE"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::PACKAGES_PAT is not set — the manifests still point at the previous version"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

      - name: Check out the Homebrew tap
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ronny1020/homebrew-tap
          token: ${{ secrets.PACKAGES_PAT }}
          path: homebrew-tap

      - name: Rewrite the cask
        if: steps.token.outputs.present == 'true'
        working-directory: homebrew-tap
        run: |
          cask=Casks/muster.rb
          sed -i -E "s/^  version \".*\"/  version \"$PLAIN_VERSION\"/" "$cask"
          # Anchored to the `sha256` block. A bare `arm:`/`intel:` also matches
          # the `arch arm: "aarch64", intel: "x64"` line above it, which maps the
          # URL suffix — rewriting that to a checksum makes every download a 404,
          # and the cask still parses, so nothing downstream would catch it.
          sed -i -E "s/(sha256 arm: +)\"[^\"]*\"/\1\"$SHA_AARCH64\"/" "$cask"
          sed -i -E "s/^( +intel: +)\"[^\"]*\"/\1\"$SHA_X64_DMG\"/" "$cask"
          grep -q 'arch arm: "aarch64", intel: "x64"' "$cask" || {
            echo "::error::the arch line was rewritten"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "muster $PLAIN_VERSION" && git push

      - name: Check out the Scoop bucket
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ronny1020/scoop-bucket
          token: ${{ secrets.PACKAGES_PAT }}
          path: scoop-bucket

      - name: Rewrite the manifest
        if: steps.token.outputs.present == 'true'
        working-directory: scoop-bucket
        run: |
          manifest=bucket/muster.json
          # jq rather than sed: the version appears inside the URL too.
          jq --arg v "$PLAIN_VERSION" --arg hash "$SHA_X64_EXE" '
            .version = $v
            | .architecture."64bit".hash = $hash
            | .architecture."64bit".url =
                "https://github.com/ronny1020/muster/releases/download/v\($v)/Muster_\($v)_x64-setup.exe#/setup.exe"
          ' "$manifest" > tmp && mv tmp "$manifest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "muster $PLAIN_VERSION" && git push
