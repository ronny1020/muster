# The five checks CONTRIBUTING.md asks contributors to run.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push supersedes the first; finishing the old run helps nobody.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run format:check
      - run: bun test

  backend:
    # Every argv builder compiles on all three hosts, so Linux covers the
    # Windows and WSL launch strings. macOS is here for a different reason: the
    # pty tests are the only ones that touch a real process group, and `lsof`
    # is the macOS-specific way the working directory is read back.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the webview toolkit
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test --lib
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
